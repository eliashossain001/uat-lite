[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uat-lite"
version = "1.0.0"
description = "UAT-LITE: uncertainty-aware inference for pretrained transformer classifiers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["uat_lite", "uat_lite.models"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
