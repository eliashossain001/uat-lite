<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="UAT-LITE: attention to uncertain tokens is attenuated by exp(-lambda u)">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset=".55" stop-color="#1e1b4b"/><stop offset="1" stop-color="#134e4a"/></linearGradient>
<linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.title{font-size:64px;font-weight:800;letter-spacing:2px}
.sub{font-size:22px;fill:#cbd5e1}
.eq{font-size:18px;fill:#94a3b8;font-family:ui-monospace,Menlo,Consolas,monospace}
.arc{fill:none;stroke:#67e8f9;stroke-linecap:round;stroke-dasharray:10 8;animation:flow 1.6s linear infinite;opacity:.85}
.arc.hot{stroke:#fbbf24;animation:flow 1.6s linear infinite,fade 3s ease-in-out infinite}
.tok rect{fill:rgba(255,255,255,.07);stroke:#64748b;stroke-width:1.5}
.tok text{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;fill:#e2e8f0;text-anchor:middle}
.tok.hot rect{stroke:#fbbf24;fill:rgba(251,191,36,.15);animation:pulse 3s ease-in-out infinite}
.tok.hot text{fill:#fde68a}
.bar{fill:#67e8f9;opacity:.7}
.hotbar{fill:#fbbf24;opacity:1;animation:pulse 3s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes fade{0%,100%{opacity:.9}50%{opacity:.12}}
@keyframes pulse{0%,100%{filter:none}50%{filter:url(#glow)}}
</style>
<rect width="1200" height="320" rx="18" fill="url(#bg)"/>
<text class="title" x="600" y="84" text-anchor="middle" fill="url(#ttl)">UAT-LITE</text>
<text class="sub" x="600" y="122" text-anchor="middle">Inference-time uncertainty-aware attention for pretrained transformers</text>
<text class="eq" x="1150" y="310" text-anchor="end">ã = a · exp(−λ u)   ·   bars: token uncertainty u</text>
<path class="arc" d="M150 236 Q 225 158 300 236" stroke-width="4.8" style="animation-delay:0.15s"/>
<path class="arc" d="M150 236 Q 300 140 450 236" stroke-width="4.3" style="animation-delay:0.30s"/>
<path class="arc" d="M150 236 Q 375 122 600 236" stroke-width="4.5" style="animation-delay:0.45s"/>
<path class="arc hot" d="M150 236 Q 450 104 750 236" stroke-width="1.0" style="animation-delay:0.60s"/>
<path class="arc" d="M150 236 Q 525 86 900 236" stroke-width="4.0" style="animation-delay:0.75s"/>
<path class="arc" d="M150 236 Q 600 68 1050 236" stroke-width="4.6" style="animation-delay:0.90s"/>
<g class="tok"><rect x="92" y="236" width="116" height="44" rx="10"/><text x="150" y="265">[CLS]</text></g>
<g class="tok"><rect x="242" y="236" width="116" height="44" rx="10"/><text x="300" y="265">the</text></g>
<g class="tok"><rect x="392" y="236" width="116" height="44" rx="10"/><text x="450" y="265">drug</text></g>
<g class="tok"><rect x="542" y="236" width="116" height="44" rx="10"/><text x="600" y="265">did</text></g>
<g class="tok hot"><rect x="692" y="236" width="116" height="44" rx="10"/><text x="750" y="265">not</text></g>
<g class="tok"><rect x="842" y="236" width="116" height="44" rx="10"/><text x="900" y="265">reduce</text></g>
<g class="tok"><rect x="992" y="236" width="116" height="44" rx="10"/><text x="1050" y="265">pain</text></g>
<rect class="bar" x="100" y="286" width="5" height="6" rx="3"/>
<rect class="bar" x="250" y="286" width="12" height="6" rx="3"/>
<rect class="bar" x="400" y="286" width="22" height="6" rx="3"/>
<rect class="bar" x="550" y="286" width="18" height="6" rx="3"/>
<rect class="bar hotbar" x="700" y="286" width="95" height="6" rx="3"/>
<rect class="bar" x="850" y="286" width="30" height="6" rx="3"/>
<rect class="bar" x="1000" y="286" width="15" height="6" rx="3"/>
</svg>
